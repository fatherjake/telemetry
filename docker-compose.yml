name: claude-telemetry

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: claude-telemetry-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./data/raw:/data/raw
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:13133" # health check
